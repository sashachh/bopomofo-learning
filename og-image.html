<!DOCTYPE html>
<html>
<head>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            width: 1200px;
            height: 630px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', sans-serif;
        }
        .logo-text {
            font-size: 8rem;
            font-weight: bold;
            text-shadow: 4px 4px 8px rgba(0,0,0,0.3);
            margin-bottom: 30px;
        }
        .bo { color: #FF69B4; }
        .po { color: #FFD700; }
        .mo { color: #4ecdc4; }
        .fo { color: #FF6B6B; }
        .dot { color: #32CD32; }
        .tagline {
            color: white;
            font-size: 2.5rem;
            opacity: 0.95;
        }
        .symbols {
            margin-top: 40px;
            font-size: 3rem;
            color: rgba(255,255,255,0.8);
            letter-spacing: 15px;
        }
    </style>
</head>
<body>
    <div class="logo-text">
        <span class="bo">bo</span><span class="po">po</span><span class="mo">mo</span><span class="dot">.</span><span class="fo">fo</span>
    </div>
    <div class="tagline">Interactive Bopomofo Learning</div>
    <div class="symbols">ㄅ ㄆ ㄇ ㄈ ㄉ ㄊ ㄋ ㄌ</div>
</body>
</html>
